<body style="cursor: url('/cursor/default.svg') 4 3, auto;">
    <title>Custom Cursor Example</title>
    <link rel="icon" href="cursor/default.svg">
    <h1 style="font-family: Arial, sans-serif; color: #333; text-align: center; margin-top: 50px; cursor: url('cursor/text.svg') 4 3, auto;">Custom Cursor Example</h1>
    <p style="font-family: Arial, sans-serif; text-align: center; cursor: url('cursor/text.svg') 4 3, auto;">Move your mouse around to see the custom cursor in action!</p>
    <div style="display: flex; justify-content: center; align-items: center;"><button style="font-family: Arial, sans-serif; padding: 10px 20px; background-color: #007bff; color: #fff; border: none; cursor: url('cursor/link.svg') 4 3, auto; border-radius: 5px;" onclick="alert('Button clicked!');" onmouseenter="this.style.filter='brightness(85%)'" onmouseleave="this.style.filter='none'">Click me!</button></div>
</body>
